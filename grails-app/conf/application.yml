info:
  app:
    name: '@info.app.name@'
    version: '@info.app.version@'
    grailsVersion: '@info.app.grailsVersion@'
grails:
  codegen:
    defaultPackage: com.example
  profile: web
  views:
    gsp:
      encoding: UTF-8
      codecs:
        scriptlet: html
dataSource:
  driverClassName: org.postgresql.Driver
  username: postgres
  password: ''
  pooled: true
  jmxExport: true
environments:
  development:
    dataSource:
      dbCreate: create-drop
      url: jdbc:postgresql://localhost:5432/devDb?tcpKeepAlive=true
  test:
    dataSource:
      dbCreate: update
      url: jdbc:postgresql://localhost:5432/testDb?tcpKeepAlive=true
      username: test
      password: test
    grails:
      plugin:
        databasemigration:
          dropOnStart: true
          updateOnStart: true
          updateOnStartFileName: changelog-test.groovy
  production:
    dataSource:
      dbCreate: none
      url: jdbc:postgresql://localhost:5432/postgres?tcpKeepAlive=true
hibernate:
  cache:
    queries: false
    use_second_level_cache: false
    use_query_cache: false
